name: Bug report
description: Something in Kami does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste secrets, tokens or contact details of real people. For vulnerabilities use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Enter domain …\n2. …"
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities
      description: Output of `npm run readiness` (it never prints secrets) or `GET /api/capabilities`.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or Activity entries
      description: Relevant server log lines, or the failing agent run from Activity → Agent runs.
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "git rev-parse --short HEAD"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows, Other]
